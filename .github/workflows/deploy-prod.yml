# Sample prod deploy using the single "Prod" GitHub Environment.
# Manual only, from main only. Runs checks first; then every deploy job pauses
# until a required reviewer on the Prod environment approves (deploy-api and
# deploy-ui wait together, so the reviewer approves both in one go). The "deploy" is a dry
# run that only prints which Prod values it would use.
name: deploy-prod

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        type: choice
        options: [all, api, ui]
        default: all

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # Refuse to release anything that isn't main, before doing any work.
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Prod deploys only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::deploy-prod must run from main (got ${{ github.ref_name }})"
          exit 1
      - run: echo "Releasing main @ ${{ github.sha }}"

  # Stand-in for the real ci.yml.
  checks:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint and test (placeholder)
        run: echo "Checks for main @ ${{ github.sha }} passed"

  deploy-api:
    needs: checks
    if: inputs.target == 'all' || inputs.target == 'api'
    runs-on: ubuntu-latest
    environment: Prod   # waits here for a Prod reviewer's approval
    steps:
      - uses: actions/checkout@v4
      - name: Deploy api (dry run)
        env:
          ECR_REGISTRY_URL: ${{ vars.ECR_REGISTRY_URL }}
          API_ECR_REPOSITORY: ${{ vars.API_ECR_REPOSITORY }}
          API_EXPRESS_SERVICE_ARN: ${{ vars.API_EXPRESS_SERVICE_ARN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          echo "Region:  ${{ vars.AWS_REGION }}"
          echo "Image:   $ECR_REGISTRY_URL/$API_ECR_REPOSITORY:${GITHUB_SHA::7}"
          echo "Service: $API_EXPRESS_SERVICE_ARN"
          [ -n "$AWS_ACCESS_KEY_ID" ] && echo "AWS credentials: present (Prod environment secret)"
      # Smoke runs inside the deploy job: a separate job using the Prod
      # environment would ask the reviewer to approve a second time.
      - name: Smoke check (dry run)
        run: echo "Would check https://${{ vars.SMOKE_HOST }}/healthz"

  deploy-ui:
    needs: checks
    if: inputs.target == 'all' || inputs.target == 'ui'
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - uses: actions/checkout@v4
      - name: Deploy ui (dry run)
        env:
          ECR_REGISTRY_URL: ${{ vars.ECR_REGISTRY_URL }}
          UI_ECR_REPOSITORY: ${{ vars.UI_ECR_REPOSITORY }}
          UI_EXPRESS_SERVICE_ARN: ${{ vars.UI_EXPRESS_SERVICE_ARN }}
        run: |
          echo "Image:   $ECR_REGISTRY_URL/$UI_ECR_REPOSITORY:${GITHUB_SHA::7}"
          echo "Service: $UI_EXPRESS_SERVICE_ARN"
          echo "API URL: ${{ vars.UI_NEXT_PUBLIC_API_URL }}"
